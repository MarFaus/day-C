<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">День С — платформа для конференций WorldSkills TP17</title>
  <desc id="desc">Лендинг проекта: админка организатора, REST API и одностраничное приложение участника.</desc>

  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f7f1"/>
      <stop offset="0.55" stop-color="#f3f0e7"/>
      <stop offset="1" stop-color="#ece8dc"/>
    </linearGradient>
    <linearGradient id="fadeGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f6b58"/>
      <stop offset="1" stop-color="#0a4f41"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#111a21" opacity="0.07"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#111a21" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#wash)"/>
  <rect width="1280" height="360" fill="url(#dots)"/>
  <circle cx="1180" cy="26" r="190" fill="#c9f26a" opacity="0.14"/>
  <circle cx="86" cy="332" r="150" fill="#0f6b58" opacity="0.06"/>

  <!-- Left: identity -->
  <g>
    <rect x="64" y="58" width="46" height="46" rx="12" fill="#111a21"/>
    <text x="87" y="89" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#c9f26a">WS</text>

    <text x="124" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3.4" fill="#64717c">WORLDSKILLS · TP17</text>
    <text x="124" y="99" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#111a21">Event platform</text>

    <text x="62" y="207" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" letter-spacing="-2" fill="#111a21">День С</text>

    <rect x="64" y="228" width="52" height="4" rx="2" fill="#0f6b58"/>
    <text x="64" y="267" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#26333d">Платформа для конференций: админка,</text>
    <text x="64" y="293" font-family="'Segoe UI', Arial, sans-serif" font-size="19" fill="#26333d">REST API и личный кабинет участника.</text>

    <g font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600">
      <rect x="64" y="316" width="92" height="26" rx="13" fill="#111a21"/>
      <text x="110" y="333" text-anchor="middle" fill="#f9f7f1">Laravel 13</text>
      <rect x="164" y="316" width="104" height="26" rx="13" fill="#ffffff" stroke="#e2ddd2"/>
      <text x="216" y="333" text-anchor="middle" fill="#26333d">REST API</text>
      <rect x="276" y="316" width="96" height="26" rx="13" fill="#ffffff" stroke="#e2ddd2"/>
      <text x="324" y="333" text-anchor="middle" fill="#26333d">Vanilla JS</text>
      <rect x="380" y="316" width="132" height="26" rx="13" fill="#dff1e9"/>
      <text x="446" y="333" text-anchor="middle" fill="#0a4f41">MySQL · SQLite</text>
    </g>
  </g>

  <!-- Right: mini agenda board -->
  <g filter="url(#soft)">
    <rect x="648" y="52" width="568" height="256" rx="22" fill="#fffdf9" stroke="#e2ddd2"/>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="676" y="87" font-size="10" font-weight="700" letter-spacing="2.2" fill="#64717c">EVENT PROGRAMME</text>
    <text x="676" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#111a21">WorldSkills Conference 2019</text>
    <rect x="676" y="126" width="72" height="3" rx="1.5" fill="#c9f26a"/>
  </g>

  <!-- grid header -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.4" fill="#64717c">
    <text x="678" y="154">TIME</text>
    <text x="738" y="154">MAIN HALL</text>
    <text x="854" y="154">ROOM 1.1</text>
    <text x="970" y="154">ROOM 1.3</text>
    <text x="1086" y="154">ROOM 3.1</text>
  </g>
  <line x1="676" y1="164" x2="1188" y2="164" stroke="#e2ddd2"/>
  <g stroke="#ece7dc">
    <line x1="752" y1="164" x2="752" y2="282"/>
    <line x1="868" y1="164" x2="868" y2="282"/>
    <line x1="984" y1="164" x2="984" y2="282"/>
    <line x1="1100" y1="164" x2="1100" y2="282"/>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#64717c">
    <text x="678" y="188">09:00</text>
    <text x="678" y="238">11:00</text>
    <text x="678" y="288">13:00</text>
  </g>
  <g stroke="#ece7dc" stroke-dasharray="2 4">
    <line x1="722" y1="183" x2="1188" y2="183"/>
    <line x1="722" y1="233" x2="1188" y2="233"/>
    <line x1="722" y1="283" x2="1188" y2="283"/>
  </g>

  <!-- session cards -->
  <g font-family="'Segoe UI', Arial, sans-serif">
    <rect x="756" y="172" width="104" height="34" rx="8" fill="#f5f1e8" stroke="#e2ddd2"/>
    <rect x="756" y="172" width="3" height="34" rx="1.5" fill="#0f6b58"/>
    <text x="766" y="186" font-size="7.5" font-weight="700" fill="#64717c">09:00–09:45</text>
    <text x="766" y="198" font-size="9.5" font-weight="700" fill="#111a21">Different place…</text>

    <rect x="872" y="220" width="104" height="54" rx="8" fill="#eef1e6" stroke="#e2ddd2"/>
    <rect x="872" y="220" width="3" height="54" rx="1.5" fill="#8a6d1f"/>
    <text x="882" y="234" font-size="7.5" font-weight="700" fill="#64717c">13:00–15:00</text>
    <text x="882" y="247" font-size="9.5" font-weight="700" fill="#111a21">Designing skills</text>
    <text x="882" y="259" font-size="9.5" font-weight="700" fill="#111a21">pathways</text>

    <rect x="988" y="172" width="104" height="34" rx="8" fill="#f5f1e8" stroke="#e2ddd2"/>
    <rect x="988" y="172" width="3" height="34" rx="1.5" fill="#0f6b58"/>
    <text x="998" y="186" font-size="7.5" font-weight="700" fill="#64717c">11:00–11:45</text>
    <text x="998" y="198" font-size="9.5" font-weight="700" fill="#111a21">The future of work</text>

    <rect x="1104" y="252" width="80" height="34" rx="8" fill="#f5f1e8" stroke="#e2ddd2"/>
    <rect x="1104" y="252" width="3" height="34" rx="1.5" fill="#0f6b58"/>
    <text x="1114" y="266" font-size="7.5" font-weight="700" fill="#64717c">15:00–16:00</text>
    <text x="1114" y="278" font-size="9.5" font-weight="700" fill="#111a21">Our planet</text>
  </g>

  <!-- floating test badge -->
  <g filter="url(#soft)">
    <rect x="1012" y="300" width="208" height="44" rx="22" fill="#111a21"/>
  </g>
  <circle cx="1036" cy="322" r="7" fill="#c9f26a"/>
  <text x="1052" y="327" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#f9f7f1">21 / 21 tests passing</text>
</svg>
