<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура проекта «День С»</title>
  <desc id="desc">Клиентский слой, Laravel-приложение и слой данных, а также приёмочные тесты PHPUnit.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f3"/>
      <stop offset="1" stop-color="#f1ede3"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#111a21" stroke-opacity="0.045"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0f6b58"/>
    </marker>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#111a21" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1280" height="660" fill="url(#bg)"/>
  <rect width="1280" height="660" fill="url(#grid)"/>

  <text x="64" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#111a21">Как это устроено</text>
  <text x="64" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#64717c">Один Laravel-инстанс отдаёт REST API, админку и SPA. Данные — MySQL/MariaDB или SQLite.</text>
  <rect x="64" y="116" width="64" height="4" rx="2" fill="#c9f26a"/>

  <!-- Layer labels -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" fill="#64717c">
    <text x="64" y="162">КЛИЕНТСКИЙ СЛОЙ</text>
    <text x="452" y="162">ПРИЛОЖЕНИЕ</text>
    <text x="936" y="162">ДАННЫЕ</text>
  </g>

  <!-- Client column -->
  <g filter="url(#cardShadow)">
    <rect x="64" y="180" width="300" height="110" rx="16" fill="#fffdf9" stroke="#e2ddd2"/>
    <rect x="64" y="198" width="4" height="74" rx="2" fill="#0f6b58"/>
    <rect x="64" y="330" width="300" height="110" rx="16" fill="#fffdf9" stroke="#e2ddd2"/>
    <rect x="64" y="348" width="4" height="74" rx="2" fill="#0f6b58"/>
    <rect x="64" y="480" width="300" height="96" rx="16" fill="#111a21" stroke="#111a21"/>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="88" y="212" font-size="15.5" font-weight="700" fill="#111a21">SPA участника</text>
    <text x="88" y="234" font-size="11.5" fill="#64717c">Vanilla JS · hash-роутер · /app</text>
    <text x="88" y="252" font-size="11.5" fill="#64717c">События, программа, регистрация, оценки</text>
    <text x="88" y="270" font-size="11.5" fill="#64717c">Общается только с /api/v1</text>

    <text x="88" y="362" font-size="15.5" font-weight="700" fill="#111a21">Админка организатора</text>
    <text x="88" y="384" font-size="11.5" fill="#64717c">Blade · Bootstrap · /admin</text>
    <text x="88" y="402" font-size="11.5" fill="#64717c">CRUD, проверка занятости комнат,</text>
    <text x="88" y="420" font-size="11.5" fill="#64717c">отчёт Room capacity на Chart.js</text>

    <text x="88" y="512" font-size="15.5" font-weight="700" fill="#f9f7f1">Приёмочные тесты</text>
    <text x="88" y="534" font-size="11.5" fill="#c9c5bc">PHPUnit 9.6 · tests/php-api</text>
    <text x="88" y="552" font-size="11.5" fill="#c9c5bc">21 тест · 77 проверок</text>
  </g>

  <!-- App column -->
  <g filter="url(#cardShadow)">
    <rect x="452" y="180" width="420" height="396" rx="18" fill="#111a21"/>
  </g>
  <rect x="472" y="202" width="380" height="52" rx="10" fill="#1b2730" stroke="#2c3a44"/>
  <text x="490" y="224" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6" fill="#c9f26a">LARAVEL 13</text>
  <text x="490" y="242" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#f9f7f1">Маршруты, контроллеры, модели</text>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#d8d4cb">
    <rect x="472" y="268" width="380" height="42" rx="9" fill="#16212a" stroke="#2c3a44"/>
    <text x="490" y="294" font-size="11.5" font-weight="700" fill="#f9f7f1">routes/web.php</text>
    <text x="612" y="294" font-size="11">сессии организатора, админка</text>

    <rect x="472" y="318" width="380" height="42" rx="9" fill="#16212a" stroke="#2c3a44"/>
    <text x="490" y="344" font-size="11.5" font-weight="700" fill="#f9f7f1">routes/api.php</text>
    <text x="612" y="344" font-size="11">JSON API v1, токены участников</text>

    <rect x="472" y="368" width="380" height="42" rx="9" fill="#16212a" stroke="#2c3a44"/>
    <text x="490" y="394" font-size="11.5" font-weight="700" fill="#f9f7f1">Controllers · Models</text>
    <text x="612" y="394" font-size="11">мультитенантность по организатору</text>

    <rect x="472" y="418" width="380" height="42" rx="9" fill="#16212a" stroke="#2c3a44"/>
    <text x="490" y="444" font-size="11.5" font-weight="700" fill="#f9f7f1">app:install</text>
    <text x="612" y="444" font-size="11">схема, дамп и демо-аккаунты</text>

    <rect x="472" y="468" width="380" height="42" rx="9" fill="#16212a" stroke="#2c3a44"/>
    <text x="490" y="494" font-size="11.5" font-weight="700" fill="#f9f7f1">Seeders · Rules</text>
    <text x="612" y="494" font-size="11">импорт db-dump.sql, даты демо-набора</text>
  </g>

  <!-- Data column -->
  <g filter="url(#cardShadow)">
    <rect x="936" y="180" width="280" height="110" rx="16" fill="#dff1e9" stroke="#b9dccd"/>
    <rect x="936" y="330" width="280" height="110" rx="16" fill="#fffdf9" stroke="#e2ddd2"/>
    <rect x="936" y="480" width="280" height="96" rx="16" fill="#fffdf9" stroke="#e2ddd2"/>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="960" y="212" font-size="15.5" font-weight="700" fill="#0a4f41">MySQL / MariaDB</text>
    <text x="960" y="234" font-size="11.5" fill="#3e5d54">Основной режим и приёмочные тесты</text>
    <text x="960" y="252" font-size="11.5" fill="#3e5d54">База wsc_t17 · порт 3306</text>
    <text x="960" y="270" font-size="11.5" fill="#3e5d54">Полный дамп WorldSkills</text>

    <text x="960" y="362" font-size="15.5" font-weight="700" fill="#111a21">SQLite</text>
    <text x="960" y="384" font-size="11.5" fill="#64717c">Быстрый старт без настройки сервера</text>
    <text x="960" y="402" font-size="11.5" fill="#64717c">database/database.sqlite</text>
    <text x="960" y="420" font-size="11.5" fill="#64717c">Тот же дамп и те же демо-данные</text>

    <text x="960" y="512" font-size="15.5" font-weight="700" fill="#111a21">db-dump.sql</text>
    <text x="960" y="534" font-size="11.5" fill="#64717c">Исходный дамп + DumpSeeder</text>
    <text x="960" y="552" font-size="11.5" fill="#64717c">5 событий · 702 регистрации</text>
  </g>

  <!-- Arrows -->
  <g stroke="#0f6b58" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M364 235 H444"/>
    <path d="M364 385 H444"/>
    <path d="M872 235 H928"/>
    <path d="M872 385 H928"/>
  </g>
  <g stroke="#9a948a" stroke-width="1.6" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)">
    <path d="M364 528 H444"/>
  </g>

  <text x="64" y="630" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#8a8478">Схема упрощена: показаны ключевые слои и потоки, а не все классы приложения.</text>
</svg>
